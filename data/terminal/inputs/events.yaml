# Hand-maintained catalysts for the terminal calendar. Edit freely; the daily run rebuilds
# data/terminal/calendar.json from this file plus:
#   * FOMC and ECB meetings scraped from the official calendars (federalreserve.gov, ecb.europa.eu),
#   * recurring releases generated by rule (Focus Mondays, Banxico survey, Brazil bimonthly reports),
#   * past Brazil and Mexico rate decisions and elections imported from EthanC100/em-macro.
#
# Fields: date (YYYY-MM-DD), country (FR | BR | MX | GLOBAL), type (rates | fiscal | ratings |
# politics | election | trade | survey | data), title, importance (1-3), status (confirmed |
# estimated), source (URL), note, query (GDELT DOC keywords for the attention score; events
# sharing a query share one measurement).
#
# "confirmed" means the date is published by the institution (or fixed in law); "estimated" means
# it follows from a rule or a past pattern and must be checked. Last reviewed 2026-10-29.

events:
  # ---------------- France ----------------
  - {date: 2026-11-27, country: FR, type: ratings, importance: 3, status: confirmed,
     title: "S&P Global sovereign rating review: France",
     source: "https://disclosure.spglobal.com/ratings/en/regulatory/article/-/view/sourceId/101599026",
     note: "EU-regulated sovereign calendar date (Friday, after market close).",
     query: '"S&P" France rating'}
  - {date: 2026-12-15, country: FR, type: fiscal, importance: 3, status: estimated,
     title: "Budget (PLF 2027): Article 47 70-day deadline",
     source: "https://www.conseil-constitutionnel.fr/le-bloc-de-constitutionnalite/texte-integral-de-la-constitution-du-4-octobre-1958-en-vigueur",
     note: "Constitution art. 47: if Parliament has not decided within 70 days of the bill being tabled, the budget can be enacted by ordinance. 70 days from tabling on the first Tuesday of October (6 Oct 2026) = 15 Dec; confirm against the actual tabling date.",
     query: 'France budget "National Assembly"'}
  - {date: 2027-04-11, country: FR, type: election, importance: 3, status: estimated,
     title: "Presidential election, first round",
     source: "https://www.interieur.gouv.fr/Elections",
     note: "Date is set by decree; April 2027 expected (2022: 10 Apr). Replace when the decree is published.",
     query: 'France "presidential election" 2027'}
  - {date: 2027-04-25, country: FR, type: election, importance: 3, status: estimated,
     title: "Presidential election, second round",
     source: "https://www.interieur.gouv.fr/Elections",
     note: "Two weeks after the first round, set by the same decree.",
     query: 'France "presidential election" 2027'}

