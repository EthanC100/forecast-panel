countries:
  BR:
    approach:
      summary: >
        A centre-left government running mixed policy: a rules-based fiscal framework (looser than the
        2016 spending cap it replaced) and an independent, inflation-targeting central bank, alongside
        a large role for directed credit and redistributive spending and tax measures.
      policies:
      - name: Fiscal framework (spending corridor and primary target)
        position: 55
        why: >
          Rules-based: real federal spending growth is held between 0.6% and 2.5% a year and tied to
          revenue and to an annual primary-balance target with a 0.25-point tolerance band. Looser than
          the zero-real-growth cap of 2016 that it replaced, and the Senate's fiscal institution doubts the
          2027 target can be met without freezing spending.
        sources: [imf_br_2025, ifi_raf116]
      - name: Monetary policy (Banco Central do Brasil, inflation targeting)
        position: 85
        why: >
          Orthodox: the central bank answered inflation expectations rising above the target band with a
          tightening cycle from September 2024, 450 basis points of hikes to 15% by June 2025; the Selic
          target has since been cut (see the stored series for today's level).
        sources: [imf_br_2025, bcb_selic]
      - name: Directed (earmarked) credit through state banks and BNDES
        position: 25
        why: >
          Interventionist: credit at regulated or subsidised rates is a large share of lending (42.2% in
          January 2025 by the IMF's count, below its 2016-17 peak of half), and the IMF estimates that
          policy-rate changes pass through to it at only about a fifth of the rate seen in market lending.
        sources: [imf_br_2025]
      - name: Minimum wage, benefits and income-tax changes
        position: 35
        why: >
          Redistributive: benefits and pensions are linked to the minimum wage (its real growth is now
          capped at 2.5% a year), and an income-tax reform adds a minimum tax of up to 10% for individuals
          earning over R$50,000 a month.
        sources: [imf_br_2025]
      - name: Consumption-tax reform (dual VAT, CBS and IBS)
        position: 70
        why: >
          Efficiency-oriented and broadly supported by orthodox economists: Complementary Law 214/2025
          replaces several cascading consumption taxes with a dual VAT, phased in from 2027.
        sources: [imf_br_2025]
  MX:
    approach:
      summary: >
        A left-of-centre government pairing fiscal consolidation and an independent, inflation-targeting
        central bank with a strongly state-led energy policy and large real minimum-wage increases.
      policies:
      - name: Fiscal consolidation after the 2024 deficit
        position: 60
        why: >
          Consolidating: after using an escape clause to run a 5.7% of GDP deficit in 2024 (from 4.3% in
          2023), the government targeted 3.9% for 2025 and plans public-sector borrowing of 4.1% of GDP in
          2026 and 3.5% in 2027, largely by compressing capital spending and stronger tax administration.
        sources: [imf_mx_2025, imco_2027]
      - name: Monetary policy (Banxico, inflation targeting)
        position: 75
        why: >
          Orthodox framework, now easing: Banxico has cut its policy rate by 375 basis points since early
          2024 as inflation fell; the IMF asks it to publish rate-path scenarios to clarify how it reacts.
        sources: [imf_mx_2025, banxico_target]
      - name: Energy policy and support for Pemex and CFE
        position: 15
        why: >
          Interventionist: the 2025 energy laws give the state firms priority; almost 6% of GDP is
          earmarked for investment in Pemex, and the Treasury supports its debt.
        sources: [imf_mx_2025, enerdata_pemex]
      - name: Minimum wage policy
        position: 20
        why: >
          Interventionist: the minimum wage has risen 125% in real terms since 2018, a 2024 constitutional
          reform bars rises below inflation, and the plan is close to 12% a year in nominal terms to 2030.
          The IMF finds no material harm to employment so far.
        sources: [imf_mx_2025]
  FR:
    approach:
      summary: >
        A minority government trying to consolidate one of the euro area's largest deficits under an EU
        excessive-deficit procedure, in a high-tax, high-spending state, with monetary policy set by the
        ECB for the whole euro area and the 2023 pension reform suspended.
      policies:
      - name: 2027 budget consolidation and the EU excessive-deficit procedure
        position: 60
        why: >
          Consolidating: the 2027 bills plan about 54 billion euros of consolidation, 43 billion of it new
          measures, after a 5.8% of GDP deficit in 2024; France has been under the excessive-deficit
          procedure since January 2025 and aims for a deficit below 3% by 2029.
        sources: [hcfp_2026_5, imf_fr_2025]
      - name: Size of the state (tax and spending levels)
        position: 30
        why: >
          On the interventionist side by level: the IMF stresses France's high tax-to-GDP ratio and
          pension spending of 14.7% of GDP in 2022, and asks for savings from better-targeted spending.
        sources: [imf_fr_2025]
      - name: Pension reform suspension
        position: 30
        why: >
          A step back from the 2023 reform (legal age rising to 64 by 2030): the 2026 social-security law
          suspends it until 1 January 2028, while the 2027 bill freezes most basic pensions for a year.
        sources: [cms_lfss2026, imf_fr_2025, hcfp_2026_5]
      - name: Monetary policy (set by the ECB)
        position: 75
        why: >
          Orthodox and out of national hands: the ECB targets euro-area inflation; France cannot devalue
          or set its own rate, so bond spreads over Germany carry the market's view of French policy.
        sources: [ecb_dfr, imf_fr_2025]

episodes:
- id: br-collor-1990
  country: BR
  name: Collor Plan
  start: "1990-03-16"
  end: "1991-05-31"
  kind: heterodox
  summary: >
    A shock plan on the new president's first full day: 80% of private financial assets were frozen for
    18 months, wages and prices were temporarily frozen, the cruzeiro replaced the cruzado novo, and the
    exchange rate was floated. Inflation was not durably beaten: a second Collor plan followed, then the
    Marcílio plan from May 1991.
  cites: [w_collor, baer2014, bresser_nakano1987]
  against:
  - school: Monetarist
    why: >
      A drastic squeeze on liquid money did not end inflation for long. Brazilian economists read this as
      inertial inflation driven by indexation, which a money squeeze alone does not break.
- id: br-real-plan-1994
  country: BR
  name: Real Plan
  start: "1994-07-01"
  kind: orthodox
  summary: >
    A plan that treated inflation as both a fiscal problem and an inertial one: a non-monetary unit of
    account (the URV, worth about one US dollar) let prices realign before the real replaced it on
    1 July 1994. The real was kept close to the dollar and depreciated gradually until the maxi-devaluation
    of the January 1999 crisis. Hyperinflation ended.
  cites: [w_real_plan, w_real, baer2014, arida_lara1985]
  against:
  - school: MMT
    why: >
      Ending years of high inflation took fiscal correction and a nominal anchor, the reverse of the view
      that a currency issuer's deficits matter only once real resources run out.
- id: br-lula-orthodox-2003
  country: BR
  name: Lula's first-term orthodoxy
  start: "2003-01-01"
  end: "2006-12-31"
  kind: orthodox
  summary: >
    A left-wing government kept its predecessor's macroeconomic framework of inflation targeting, a
    floating exchange rate and primary-surplus targets, with high real interest rates early on, during a
    commodity boom.
  cites: [giambiagi2011, baer2014]
  against:
  - school: Keynesian
    why: >
      Tight fiscal and monetary policy in a confidence crisis was followed by recovery rather than a deeper
      slump (with a commodity boom helping, so the test is not clean).
- id: br-new-economic-matrix-2011
  country: BR
  name: New Economic Matrix
  start: "2011-09-01"
  end: "2014-12-31"
  kind: heterodox
  summary: >
    Developmentalist measures under President Rousseff: the Selic was cut from 12.5% to 7.25% between
    August 2011 and April 2013, the real was allowed to weaken, industry got tax breaks, BNDES credit
    expanded and electricity tariffs were cut. The 2014–17 crisis followed.
  cites: [w_nem, w_br_crisis, barbosa2017]
  against:
  - school: Keynesian
    why: >
      Demand stimulus through cheaper credit and tax breaks was followed by the deepest recession on
      record rather than sustained growth.
  - school: MMT
    why: >
      Pushing rates down and directing credit while the economy was near capacity was followed by higher
      inflation and a fiscal deterioration (see what followed).
- id: br-adjustment-2015
  country: BR
  name: 2015–16 recession and adjustment
  start: "2015-01-01"
  end: "2016-12-31"
  kind: crisis
  summary: >
    A new finance minister, Joaquim Levy, attempted a fiscal adjustment while the central bank kept
    raising the Selic. GDP fell by 3.5% in 2015 and 3.3% in 2016, alongside a political crisis that ended
    in President Rousseff's impeachment.
  cites: [w_br_crisis, barbosa2017, bcb_selic]
  against:
  - school: Austrian
    why: >
      Cutting spending and raising rates in a slump coincided with a deeper contraction, not a quick
      cleansing recovery.
- id: br-spending-cap-2016
  country: BR
  name: Spending cap (Constitutional Amendment 95)
  start: "2016-12-15"
  kind: consolidation
  summary: >
    A constitutional amendment capped federal spending in real terms for 20 years, and a labour reform
    followed in 2017. A small recovery followed the 2015–16 recession. The cap was replaced by a spending
    corridor in 2023.
  cites: [w_br_crisis, imf_br_2025, baer2014]
  against:
  - school: Supply-side
    why: >
      Spending restraint and labour reform were followed by a slow recovery rather than the confidence-led
      boom such reforms promise.
- id: mx-tequila-1994
  country: MX
  name: Tequila crisis
  start: "1994-12-20"
  end: "1995-12-31"
  kind: crisis
  summary: >
    After a rebellion in Chiapas and the assassination of a presidential candidate in 1994, reserves ran
    low and the government had issued dollar-linked short-term bills (tesobonos). On 20 December 1994 the
    new government devalued; two days later the peso floated and kept falling. A US-led rescue followed;
    1995 brought recession and high inflation, then recovery under a floating peso.
  cites: [w_tequila, calvo_mendoza1996, stv1996, lustig1998]
  against:
  - school: Supply-side
    why: >
      Years of liberalisation, privatisation and trade opening (NAFTA in 1994) did not prevent a
      balance-of-payments crisis.
  - school: Austrian
    why: >
      A large official rescue was followed by recovery rather than a prolonged liquidation.
- id: mx-deficit-2024
  country: MX
  name: 2024 election-year deficit
  start: "2024-01-01"
  end: "2024-12-31"
  kind: fiscal expansion
  summary: >
    Using an escape clause in its fiscal rule, the government ran a deficit of 5.7% of GDP in 2024, up
    from 4.3% in 2023. The peso weakened in 2024.
  cites: [imf_mx_2025]
- id: mx-consolidation-2025
  country: MX
  name: 2025 consolidation
  start: "2025-01-01"
  kind: consolidation
  summary: >
    The new administration targeted a 3.9% of GDP deficit for 2025 by compressing capital spending and
    strengthening revenue administration. The IMF lists fiscal consolidation among the headwinds behind
    soft growth in 2025, alongside restrictive monetary policy and US tariffs.
  cites: [imf_mx_2025]
  against:
  - school: Austrian
    why: >
      Spending cuts coincided with weaker growth, not a private-sector revival (US tariffs muddy the
      test).
- id: ar-convertibility-1991
  country: AR
  name: Convertibility (currency board)
  start: "1991-04-01"
  end: "2001-12-31"
  kind: orthodox
  summary: >
    The peso was pegged one-to-one to the US dollar with full convertibility, to end hyperinflation, along
    with mass privatisation and deregulation. It worked at first; the regime ended in the 2001–02
    collapse, with default and frozen bank deposits (the corralito).
  cites: [w_convertibility, w_ar_depression, mussa2002]
  against:
  - school: MMT
    why: >
      Giving up discretionary money creation altogether was followed by the end of hyperinflation.
- id: ar-cepo-2011
  country: AR
  name: Exchange controls (cepo)
  start: "2011-10-31"
  end: "2015-12-16"
  kind: heterodox
  summary: >
    Restrictions on buying US dollars from 2011, with a parallel ("blue") dollar trading well above the
    official rate, until the controls were lifted at the start of Mauricio Macri's presidency in 2015.
  cites: [w_cepo, w_ar_history, dornbusch_edwards1991]
  against:
  - school: Keynesian
    why: >
      Sustaining demand behind exchange controls was followed by stagnation rather than recovery (see
      what followed).
- id: ar-heterodox-2019
  country: AR
  name: Fernández government
  start: "2019-12-10"
  end: "2023-12-10"
  kind: heterodox
  summary: >
    Exchange controls, reintroduced in late 2019, were tightened; the IMF programme was replaced by a new
    Extended Fund Facility in 2022. Inflation rose to 100% (the highest since 1991) and reached 211.4% for
    2023 by INDEC's count.
  cites: [w_fernandez, w_cepo, imf_ar_2022, w_milei]
  against:
  - school: MMT
    why: >
      Spending by a currency issuer with large dollar debts and little credibility was followed by
      spiralling inflation, the constraint MMT itself places on countries without full monetary sovereignty.
- id: ar-milei-2023
  country: AR
  name: Milei shock therapy
  start: "2023-12-13"
  kind: shock therapy
  summary: >
    A 104% devaluation of the official peso, then a 2% monthly crawl, and spending cuts that delivered the
    first budget surplus since 2011. Monthly inflation fell from 25.5% in December 2023 to 8.8% in April
    2024; activity cooled.
  cites: [w_milei, imf_ar_2024]
  against:
  - school: Keynesian
    why: >
      A sharp fiscal contraction was followed by rapid disinflation; see what followed for growth.
- id: fr-rigueur-1983
  country: FR
  name: Tournant de la rigueur
  start: "1983-03-25"
  kind: consolidation
  summary: >
    After the 1981–82 Keynesian relaunch and repeated franc devaluations inside the European Monetary
    System, a third devaluation on 22 March 1983 was followed by austerity measures announced on
    25 March: France chose rigour and the EMS.
  cites: [w_rigueur, vp_rigueur, sachs_wyplosz1986]
  against:
  - school: Keynesian
    why: >
      A demand stimulus in one open economy ran into pressure on the currency instead of lasting growth.
- id: fr-juppe-1995
  country: FR
  name: Juppé plan
  start: "1995-11-15"
  end: "1997-06-01"
  kind: consolidation
  summary: >
    A plan announced on 15 November 1995 to cut the social-security deficit, in the run-up to the euro.
    Strikes lasting more than three weeks forced the government to drop the pension part; the health
    and social-security measures went ahead by ordinance.
  cites: [w_juppe]
- id: fr-consolidation-2011
  country: FR
  name: Euro-crisis consolidation
  start: "2011-01-01"
  end: "2013-12-31"
  kind: consolidation
  summary: >
    France tightened its budget during the euro-area debt crisis, as most member states did. IMF
    economists later found that growth forecasts in Europe in that period underestimated the drag from
    consolidation.
  cites: [w_euro_crisis, blanchard_leigh2013]
  against:
  - school: Austrian
    why: >
      Austerity in a weak economy was followed by stagnation rather than a confidence-led recovery (see
      what followed).
- id: fr-dissolution-2024
  country: FR
  name: Dissolution and the budget crisis
  start: "2024-06-09"
  kind: political
  summary: >
    The snap election of June–July 2024 produced a hung parliament; the government lost a no-confidence
    vote on 4 December 2024. The 2024 deficit reached 5.8% of GDP, and the 10-year OAT-Bund spread peaked
    at 88 basis points that December.
  cites: [w_fr_2024, imf_fr_2025]

schools:
  # What each school would say about each country's current policy, in its own strongest terms.
  BR:
  - school: Keynesian
    applies_to: The fiscal framework and the 15% Selic peak
    view: >
      With real interest rates among the highest in the world, monetary policy is doing too much of the
      work; fiscal tightening on top of it risks an unnecessary slowdown. Public investment should be
      protected, and debt sustainability judged by the gap between interest rates and growth, not by the
      headline deficit.
    cites: [keynes1936, blanchard2019, krugman2012]
  - school: Monetarist
    applies_to: Monetary policy and directed credit
    view: >
      Inflation is a monetary phenomenon: a credible, rule-like central bank is the anchor, and the
      tightening cycle was the right response to rising expectations. Directed credit weakens the
      transmission of monetary policy, so the same disinflation needs a higher policy rate.
    cites: [friedman1968, friedman_schwartz1963, friedman1970]
  - school: Austrian
    applies_to: Directed credit and fiscal rules
    view: >
      Subsidised credit and an interest rate set by committee distort the price of time and steer saving
      into projects that only look profitable at artificial rates. The earmarked-credit system and
      repeated fiscal-rule changes are sources of malinvestment and of the boom-bust cycle.
    cites: [hayek1931, mises1912, mises1949]
  - school: Supply-side
    applies_to: Tax reform and the cost of capital
    view: >
      Growth comes from incentives to work, save and invest. The VAT reform is the right direction;
      raising taxes on high earners and keeping a complex system of exemptions works against it.
    cites: [laffer2004, wanniski1978, mundell2000]
  - school: MMT
    applies_to: The primary target
    view: >
      A government that borrows in its own currency cannot be forced to default; the limit on spending is
      inflation and real resources, not a numerical primary target. Brazil's high interest bill is itself
      a policy choice that transfers income to bondholders.
    cites: [wray2015, kelton2020, mww2019]
  MX:
  - school: Keynesian
    applies_to: Consolidation in a slowdown
    view: >
      Cutting public investment while growth is soft and US tariffs hit exports adds to the slowdown; the
      consolidation should be slower and spare investment, which raises future capacity.
    cites: [keynes1936, blanchard_leigh2013, krugman2012]
  - school: Monetarist
    applies_to: Banxico's easing
    view: >
      Banxico's independence and inflation target are the core of Mexico's stability since the 1990s;
      easing is justified only as inflation falls, and cutting faster than underlying inflation allows
      would risk the credibility built over two decades.
    cites: [friedman1968, friedman1970]
  - school: Austrian
    applies_to: Energy policy and Pemex
    view: >
      Steering capital into a loss-making state oil company and guaranteeing its debts is a textbook
      misallocation that markets would not fund; it crowds out private investment and adds hidden public
      debt.
    cites: [hayek1944, mises1949]
  - school: Supply-side
    applies_to: Energy and investment climate
    view: >
      Priority for state firms and uncertainty about courts deter private investment just when
      nearshoring could lift growth; opening energy and keeping taxes predictable would raise supply.
    cites: [laffer2004, mundell2000]
  - school: MMT
    applies_to: Minimum wage and consolidation
    view: >
      A government issuing its own floating currency can fund full employment; the binding limit is
      inflation, which has fallen. Rising minimum wages support demand and need not cause inflation when
      there is slack.
    cites: [wray2015, kelton2020]
  FR:
  - school: Keynesian
    applies_to: The 2027 consolidation
    view: >
      Consolidating by about 54 billion euros while growth is weak risks the mistake of 2011–13, when
      multipliers were larger than forecast. A slower, credible path would cost less output and might
      lower debt faster.
    cites: [keynes1936, blanchard_leigh2013, blanchard2019]
  - school: Monetarist
    applies_to: Fiscal policy under the ECB
    view: >
      With monetary policy set for the euro area, France's job is fiscal discipline so that the ECB is
      never pressed to monetise its debt; persistent deficits threaten the single currency's rule-based
      anchor.
    cites: [friedman1968, sargent1982]
  - school: Austrian
    applies_to: The size of the state
    view: >
      A very large, heavily taxed state is itself the problem; debt
      should be cut by shrinking the state, not by raising taxes, and cheap ECB money postponed the
      adjustment.
    cites: [hayek1944, mises1949, hayek1976]
  - school: Supply-side
    applies_to: Pension suspension and taxes
    view: >
      Suspending the pension reform and raising taxes lowers labour supply and investment. Lower,
      simpler taxes and later retirement would raise growth and, with it, revenue.
    cites: [laffer2004, wanniski1978]
  - school: MMT
    applies_to: The euro constraint
    view: >
      France gave up its own currency, so unlike a currency issuer it can face market pressure and
      default risk; the remedy is euro-area fiscal capacity or ECB backing, not austerity that deepens
      the slowdown.
    cites: [mitchell2015, kelton2020, mww2019]
