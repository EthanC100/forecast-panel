# Policy playbook for the Horizons country pages (Brazil, Mexico, France; Argentina as a regional
# reference). Hand-curated. Read by terminal/playbook.py, which adds what followed each episode at
# 6 and 24 months from stored data (inflation, growth, the currency, 10-year yields).
#
# Rules:
#   - Every characterisation cites a free, openly published source (url + date) or a published
#     book or paper (author, title, year). URLs were fetched when this file was written.
#   - School perspectives are paraphrased in each school's strongest terms and labelled as school
#     perspectives. No quotations.
#   - `against` names the school(s) an episode is hardest to square with, and why. It is an
#     interpretation (Horizons' reading), not a finding; the outcomes show what followed, not causes.
#   - Positions run from 0 (interventionist / Keynesian: the state steers demand, credit and prices)
#     to 100 (orthodox / monetarist: rules, independent central bank, market prices).

disclaimer: These show what followed, not proof of cause.

