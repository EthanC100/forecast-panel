<!doctype html>
<html lang="en">
<head>

<title>Catalyst</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="description" content="Catalyst: macro research for France, Brazil and Mexico: sourced market data, a catalyst calendar, scenario pages and crowd-error gauges.">
<link rel="stylesheet" href="terminal.css">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<body>
<header class="top">
  <a class="brand" href="#today"><img src="icons/icon-32.png" width="22" height="22" alt="" aria-hidden="true">Catalyst</a>
  <nav class="top-links" aria-label="Countries and tools">
    <a href="#country/FR" data-r="country/FR">FR</a>
    <a href="#country/BR" data-r="country/BR">BR</a>
    <a href="#country/MX" data-r="country/MX">MX</a>
    <a href="#glossary" data-r="glossary" title="Plain-English definitions">Terms</a>
    <a href="#status" data-r="status" title="Source status">Status</a>
    <a href="lab/" title="The original forecast panel">Lab</a>
    <button id="theme" class="icon" type="button" aria-label="Colour scheme">◐</button>
  </nav>
</header>

<div id="offline" class="offline" role="status">Offline: showing the data loaded last time.</div>
<main id="app" class="page" tabindex="-1"></main>

<nav class="bottom" aria-label="Main">
  <a href="#today" data-r="today"><span class="i" aria-hidden="true">◉</span>Today</a>
  <a href="#calendar" data-r="calendar"><span class="i" aria-hidden="true">▦</span>Calendar</a>
  <a href="#scenarios" data-r="scenarios"><span class="i" aria-hidden="true">⑂</span>Scenarios</a>
  <a href="#crowd" data-r="crowd"><span class="i" aria-hidden="true">◎</span>Crowd</a>
  <a href="#record" data-r="record"><span class="i" aria-hidden="true">✓</span>Record</a>
</nav>

<script src="terminal.js"></script>

</html>
