name: Terminal data

# Phase 1 data spine. Full run on weekdays after the New York close; smaller runs on each
# source's release day. Every source is isolated: a failure or a missing secret is recorded as
# red on the site's status page and the rest of the run carries on.
on:
  schedule:
    - cron: "15 22 * * 1-5"   # weekdays after the NY close (16:00 ET = 20:00/21:00 UTC): all sources + calendar
    - cron: "20 12 * * 1"     # Monday: BCB Focus survey (published ~08:25 BRT)
    - cron: "40 20 * * 5"     # Friday: CFTC Commitments of Traders (15:30 ET)
    - cron: "10 19 1-3 * *"   # first days of the month: Banxico survey of economists (12:00 CDMX)
    - cron: "30 12 8-12 * *"  # around the 10th: IPCA release (09:00 BRT)
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated source keys (blank = all sources + calendar)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-writer          # shared with panel.yml so the two never push at the same time
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main               # the latest main when the job starts, not when it was queued

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Choose sources for this trigger
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "20 12 * * 1")    echo "only=bcb_focus"   >> "$GITHUB_OUTPUT"; echo "full=no" >> "$GITHUB_OUTPUT" ;;
            "40 20 * * 5")    echo "only=cftc"        >> "$GITHUB_OUTPUT"; echo "full=no" >> "$GITHUB_OUTPUT" ;;
            "10 19 1-3 * *")  echo "only=banxico_api" >> "$GITHUB_OUTPUT"; echo "full=no" >> "$GITHUB_OUTPUT" ;;
            "30 12 8-12 * *") echo "only=bcb_sgs"     >> "$GITHUB_OUTPUT"; echo "full=no" >> "$GITHUB_OUTPUT" ;;
            *) echo "only=${{ inputs.only }}" >> "$GITHUB_OUTPUT"
               if [ -z "${{ inputs.only }}" ]; then echo "full=yes" >> "$GITHUB_OUTPUT"; else echo "full=no" >> "$GITHUB_OUTPUT"; fi ;;
          esac

      - name: Fetch sources
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          WEBSTAT_CLIENT_ID: ${{ secrets.WEBSTAT_CLIENT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m terminal.run fetch --only "${{ steps.pick.outputs.only }}"

      - name: Catalyst calendar and GDELT attention (full runs)
        if: steps.pick.outputs.full == 'yes'
        run: python -m terminal.run calendar

      - name: Paper book (fills, exits, marks) and judgements
        run: |
          python -m terminal.run book
          python -m terminal.run judge

      - name: Crowd lab tests (Mondays, full runs; reads em-macro)
        if: steps.pick.outputs.full == 'yes'
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ ! -f data/terminal/lab/crowd_tests.json ]; then
            python -m terminal.run lab || echo "::warning::lab tests failed; badges keep their last values"
          fi

      - name: Summary, scenarios and crowd for the site
        run: python -m terminal.run summary

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/terminal data/trades data/judgements data/book reports/crowd_lab.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Terminal data: $(date -u +%Y-%m-%dT%H:%MZ) ${{ steps.pick.outputs.only || 'all' }}"
            # generated files: if a code push regenerated them meanwhile, this run's fresher copy wins
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: fetch
    uses: ./.github/workflows/pages.yml
