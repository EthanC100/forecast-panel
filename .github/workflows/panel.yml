name: Daily panel snapshot (Lab)

# The original forecast panel, now under the terminal's "Lab" link. Daily snapshot of every
# forecast source; on Mondays (and manual runs) it also rebuilds the scorecard. Then redeploys
# the whole site through pages.yml.
on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-writer          # shared with terminal-data.yml
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The human columns (my_prob, claude_prob) live in gold-events/data/forward_log.csv.
      - name: Check out gold-events (human forecasts)
        id: gold
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: EthanC100/gold-events
          token: ${{ secrets.GOLD_EVENTS_TOKEN || github.token }}
          path: gold-events

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Snapshot every source
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          GOLD_EVENTS_DIR: ${{ steps.gold.outcome == 'success' && format('{0}/gold-events', github.workspace) || '' }}
        run: python snapshot.py

      - name: Score (Mondays and manual runs)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python score.py
          else
            echo "not Monday: scorecard untouched"
          fi

      - name: Build the Lab data (site/lab/data.js)
        env:
          GOLD_EVENTS_DIR: ${{ steps.gold.outcome == 'success' && format('{0}/gold-events', github.workspace) || '' }}
        run: python build_site.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/panel_log.csv data/aggregate_log.csv reports/panel_latest.md reports/scorecard.md site/lab/data.js
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Panel snapshot: $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: snapshot
    uses: ./.github/workflows/pages.yml
