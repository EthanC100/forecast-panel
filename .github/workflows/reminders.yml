name: Reminders and monthly review

# Daily: open GitHub issues assigned to the repository owner (they reach the phone as notifications)
# for stale judgements, signpost dates, trades past their horizon or moved more than 2 sd, and
# importance-3 catalysts within 3 days with no call; close reminders whose condition has cleared.
# On the 1st: draft the previous month's review in data/book/reviews/ (never overwritten).
on:
  schedule:
    - cron: "37 11 * * *"     # every day, before the European and American sessions
  workflow_dispatch:
    inputs:
      review_month:
        description: "Also draft the review for this month (YYYY-MM); blank = only on the 1st"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main               # the latest main when the job starts, not when it was queued

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Reminders
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m terminal.run reminders

      - name: Monthly review draft (the 1st, or on request)
        env:
          MONTH: ${{ inputs.review_month }}
        run: |
          if [ -n "$MONTH" ]; then
            python -m terminal.run review --month "$MONTH"
          elif [ "$(date -u +%d)" = "01" ]; then
            python -m terminal.run review
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/book/reminders.json
          [ -d data/book/reviews ] && git add data/book/reviews
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Reminders and review: $(date -u +%Y-%m-%d)"
            # generated files only; the review drafts are never regenerated, so edits are not at risk
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: remind
    uses: ./.github/workflows/pages.yml
