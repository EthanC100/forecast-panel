[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-panel"
version = "0.1.0"
description = "Aggregator of public forecasts on a fixed set of geopolitical questions, scored against outcomes and against Polymarket."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "requests>=2.28",
    "xlrd>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]
ai = ["anthropic>=2.3", "pypdf>=4"]

[tool.setuptools]
packages = ["forecast_panel", "terminal", "terminal.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
